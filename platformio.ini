; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Waveshare ESP32-S3-Relay-1CH: ESP32-S3R8 (8 MB octal PSRAM) + 16 MB flash
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  ; The USB-C connector goes to the native USB of the chip: send Serial through it
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
; Upload over WiFi (ArduinoOTA). For the first upload, or if the board is not on the network,
; comment these two lines and upload over USB.
upload_protocol = espota
upload_port = SOFAR-LOGGER.local
; If OTA_PASSWORD is set in secrets.h:
; upload_flags = --auth=password
lib_deps =
  johboh/HomeAssistantEntities @ ^10.0.2
  johboh/MQTTRemote @ ^6.0.5
  johboh/nlohmann-json @ ^3.12.0
  4-20ma/ModbusMaster @ ^2.0.1
  tzapu/WiFiManager @ ^2.0.17
